```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <video
        id="video"
        playsinline
        loop
        preload="auto"
    >
        <source src="video.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("video");

        document.addEventListener("click", () => {
            video.play();
        }, { once: true });

        document.addEventListener("touchstart", () => {
            video.play();
        }, { once: true });
    </script>

</body>
</html>
